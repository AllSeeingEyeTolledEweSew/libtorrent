name: Python bindings

on:
   push:
      branches: [ RC_1_2 RC_2_0 master ]
   pull_request:

jobs:
  test:
    name: build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-20.04, macos-latest, windows-2019 ]

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - uses: actions/setup-python@v2
      with:
        python-version: '3.6'

    - uses: AllSeeingEyeTolledEweSew/setup-boost@v1
      with:
        version: 1.76.0

    - name: build/install
      run: |
        cd bindings/python
        # Homebrew's python "framework" sets a prefix via distutils config.
        # --prefix conflicts with --user, so null out prefix so we have one
        # command that works everywhere
        python3 setup.py build_ext --b2-args="libtorrent-link=static boost-link=static" install --user --prefix=

    - name: tests
      run: |
        cd bindings/python
        python3 test.py
